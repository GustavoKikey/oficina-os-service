# =====================================================================
# OS Service — clientes, veículos, OS e orquestração da saga
# ---------------------------------------------------------------------
# Perfis: %dev (mvn quarkus:dev) e %test usam Dev Services — o Quarkus
# sobe PostgreSQL e RabbitMQ em containers sozinho. %prod (imagem Docker,
# docker-compose, EKS) recebe tudo por variável de ambiente.
# =====================================================================
quarkus.application.name=oficina-os-service
quarkus.http.port=8080
oficina.ambiente=${AMBIENTE:local}

# ===== Banco próprio (PostgreSQL) =====
# URL e credenciais só em %prod: em %dev/%test elas não podem existir, senão
# o Quarkus desliga o Dev Services e tenta um banco fixo.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:16-alpine
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/oficina_os}
%prod.quarkus.datasource.username=${DB_USER:oficina}
%prod.quarkus.datasource.password=${DB_PASSWORD:oficina}

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# ===== RabbitMQ (contratos em docs/fase-4/contratos-mensagens.md) =====
quarkus.rabbitmq.devservices.image-name=rabbitmq:4.3-management-alpine
%prod.rabbitmq-host=${RABBITMQ_HOST:localhost}
%prod.rabbitmq-port=${RABBITMQ_PORT:5672}
%prod.rabbitmq-username=${RABBITMQ_USER:guest}
%prod.rabbitmq-password=${RABBITMQ_PASSWORD:guest}

# Saída: comandos para os participantes (exchange direct, routing key = serviço).
mp.messaging.outgoing.comandos.connector=smallrye-rabbitmq
mp.messaging.outgoing.comandos.exchange.name=oficina.comandos
mp.messaging.outgoing.comandos.exchange.type=direct
mp.messaging.outgoing.comandos.exchange.declare=true
# Publisher confirms: o relay só marca a linha do outbox como publicada depois que o
# broker confirmou o recebimento (ADR 010).
mp.messaging.outgoing.comandos.publish-confirms=true

# Entrada: eventos de Execução e Billing. Fila quorum + DLQ.
mp.messaging.incoming.eventos.connector=smallrye-rabbitmq
mp.messaging.incoming.eventos.queue.name=os.eventos
mp.messaging.incoming.eventos.queue.x-queue-type=quorum
mp.messaging.incoming.eventos.exchange.name=oficina.eventos
mp.messaging.incoming.eventos.exchange.type=topic
mp.messaging.incoming.eventos.routing-keys=execucao.#,billing.#
mp.messaging.incoming.eventos.auto-bind-dlq=true
mp.messaging.incoming.eventos.dlx.declare=true
mp.messaging.incoming.eventos.dead-letter-exchange=oficina.dlx
mp.messaging.incoming.eventos.dead-letter-queue-name=os.eventos.dlq
mp.messaging.incoming.eventos.dead-letter-routing-key=os.eventos

# ===== Segurança (JWT RS256 — mesmo contrato da fase 3, ADR 001) =====
# As chaves em resources/ são SÓ de desenvolvimento e teste. Em Kubernetes o
# par real chega por Secret e estas propriedades são sobrescritas por env:
#   MP_JWT_VERIFY_PUBLICKEY_LOCATION / SMALLRYE_JWT_SIGN_KEY_LOCATION
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=oficina-mvp
smallrye.jwt.sign.key.location=privateKey.pem
quarkus.security.jaxrs.deny-unannotated-endpoints=true
# Validade do token de funcionário (o do cliente, emitido pela Lambda, dura 30 min).
oficina.jwt.expiration=PT8H

# Administrador criado na primeira subida (sobrescrever por env em produção).
oficina.admin.username=admin
oficina.admin.password=${ADMIN_PASSWORD:admin123}

# Segredo da rota interna usada pela Lambda de CPF (ADR 011). Sem valor, a rota
# responde 403 a tudo — falha segura.
oficina.interno.token=${INTERNAL_TOKEN:}
%dev.oficina.interno.token=token-interno-dev
%test.oficina.interno.token=token-interno-teste

# ===== Saga (docs/fase-4/saga.md §6) =====
# Na demonstração, reduzir por env: SAGA_PRAZO_APROVACAO=PT3M, SAGA_PRAZO_PAGAMENTO=PT5M.
oficina.saga.prazo.resposta=${SAGA_PRAZO_RESPOSTA:PT30S}
oficina.saga.prazo.aprovacao=${SAGA_PRAZO_APROVACAO:PT72H}
oficina.saga.prazo.pagamento=${SAGA_PRAZO_PAGAMENTO:PT35M}
oficina.saga.max-tentativas=3
oficina.saga.verificacao-prazos=5s
oficina.outbox.intervalo=1s
oficina.mensageria.tentativas=3
oficina.mensageria.backoff-ms=200
# Nos testes o relay roda depressa: os cenários da saga esperam cada comando sair.
%test.oficina.outbox.intervalo=0.2s
%test.oficina.outbox.atraso-inicial=0s
%test.oficina.mensageria.backoff-ms=10

# ===== Notificação por e-mail =====
# Em %dev/%test o Quarkus usa mock automaticamente (loga em vez de enviar).
quarkus.mailer.from=${MAIL_FROM:oficina@techchallenge.local}
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:587}
quarkus.mailer.username=${SMTP_USER:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.start-tls=OPTIONAL

# ===== OpenAPI / Swagger =====
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/swagger
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Oficina — OS Service
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Clientes, veículos, ordens de serviço e orquestração da saga (fase 4).
quarkus.smallrye-openapi.security-scheme=jwt

# ===== Observabilidade (reaproveitada da fase 3) =====
quarkus.otel.resource.attributes=service.namespace=oficina,deployment.environment=${AMBIENTE:local}
# Em %prod o SDK só liga quando há destino (New Relic ou Jaeger local):
#   OTEL_SDK_DISABLED=false + OTLP_ENDPOINT (+ NEW_RELIC_LICENSE_KEY no New Relic)
%prod.quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
%prod.quarkus.otel.exporter.otlp.protocol=http/protobuf
%prod.quarkus.otel.exporter.otlp.endpoint=${OTLP_ENDPOINT:https://otlp.nr-data.net:4318}
%prod.quarkus.otel.exporter.otlp.headers=api-key=${NEW_RELIC_LICENSE_KEY:}
# Em dev/test os spans existem (traceId nos logs), mas nada sai da máquina.
%dev.quarkus.otel.traces.exporter=none
%test.quarkus.otel.traces.exporter=none

# Logs JSON com traceId/spanId onde algo coleta (prod); legíveis em dev.
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.additional-field."service.name".value=oficina-os-service

quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true

%dev.quarkus.log.category."br.com.fiap.techchallenge".level=DEBUG

# ===== Cobertura (quarkus-jacoco, só em teste) =====
# Acrescenta ao arquivo dos testes de unidade em vez de apagá-lo; o relatório e o
# gate de 80% são do jacoco-maven-plugin (target/site/jacoco), lidos pelo CI e Sonar.
%test.quarkus.jacoco.data-file=target/jacoco-quarkus.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
