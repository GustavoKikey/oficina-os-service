# Service do OS Service dentro do cluster (smoke test do deploy, port-forward).
# Fora do cluster: 45-service-publico.yaml (balcão e área do cliente, restrito
# por IP) e 46-service-interno.yaml (só a VPC, para a Lambda — ADR 011).
apiVersion: v1
kind: Service
metadata:
  name: oficina-os
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-os
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oficina-os
  ports:
    - name: http
      port: 80
      targetPort: http
