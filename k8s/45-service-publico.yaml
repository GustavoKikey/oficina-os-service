# Load balancer PÚBLICO do OS Service — balcão, área do cliente e Swagger.
#
# Nasce FECHADO (127.0.0.1/32): ninguém de fora alcança. Quem vai usar abre
# para o próprio IP com scripts/liberar-meu-ip.sh (oficina-infra-k8s), e o
# deploy preserva a lista (scripts/implantar.sh). Mesmo modelo da fase 3.
apiVersion: v1
kind: Service
metadata:
  name: oficina-os-publico
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-os
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - 127.0.0.1/32
  selector:
    app.kubernetes.io/name: oficina-os
  ports:
    - name: http
      port: 80
      targetPort: http
