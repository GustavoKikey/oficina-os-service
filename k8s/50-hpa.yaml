# Escala de 2 a 4 réplicas por CPU e memória (critérios do ADR 003 da fase 3).
# Teto menor que na fase 3 (5) porque agora são três serviços dividindo os nós.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oficina-os
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-os
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oficina-os
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
